<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B3</title>
    <link rel="stylesheet" href="grid.css">
</head>

<body>
    <div class="container">

        <header class="header">
            <h1>My E-Commerce</h1>
        </header>

        <section class="hero">
            <h2>BIG SALE 50%</h2>
            <p>Mua sắm ngay hôm nay</p>
            <div class="card featured">
                <img src="https://via.placeholder.com/500x200" alt="">
                <h3>Sản phẩm nổi bật</h3>
                <p>Giảm giá cực mạnh</p>
            </div>
        </section>

        <aside class="sidebar">
            <h3>Bộ lọc</h3>

            <label>
                <input type="checkbox">
                Điện thoại
            </label>

            <label>
                <input type="checkbox">
                Laptop
            </label>

            <label>
                <input type="checkbox">
                Tai nghe
            </label>

            <label>
                <input type="checkbox">
                Đồng hồ
            </label>
        </aside>

        <main class="main-content">



            <div class="card">
                <img src="https://via.placeholder.com/300x200" alt="">
                <h3>Product 1</h3>
                <p>500.000đ</p>
            </div>

            <div class="card">
                <img src="https://via.placeholder.com/300x200" alt="">
                <h3>Product 2</h3>
                <p>700.000đ</p>
            </div>

            <div class="card">
                <img src="https://via.placeholder.com/300x200" alt="">
                <h3>Product 3</h3>
                <p>600.000đ</p>
            </div>

            <div class="card">
                <img src="https://via.placeholder.com/300x200" alt="">
                <h3>Product 4</h3>
                <p>900.000đ</p>
            </div>

            <div class="card">
                <img src="https://via.placeholder.com/300x200" alt="">
                <h3>Product 5</h3>
                <p>800.000đ</p>
            </div>

            <div class="card">
                <img src="https://via.placeholder.com/300x200" alt="">
                <h3>Product 6</h3>
                <p>1.200.000đ</p>
            </div>

        </main>

        <aside class="ads">
            <h3>Quảng cáo</h3>

            <img src="https://via.placeholder.com/180x400" alt="ads">
        </aside>

        <footer class="footer">
            <p>© 2026 My E-Commerce</p>
        </footer>

    </div>
</body>

</html>

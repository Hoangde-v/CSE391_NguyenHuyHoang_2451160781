<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animations</title>

    <link rel="stylesheet" href="animations.css">
</head>
<body>

    <header>
        <h1>Product Animation Demo</h1>
    </header>

    <!-- Loading Spinner -->
    <section class="spinner-section">
        <h2>Loading Spinner</h2>
        <div class="spinner"></div>
    </section>

    <!-- Product Cards -->
    <section class="products fade-in">

        <div class="product-card">

            <!-- Image zoom -->
            <div class="image-container">
                <img src="https://picsum.photos/300/200?1" alt="">
            </div>

            <div class="card-body">
                <h3>Gaming Mouse</h3>
                <p>$59</p>

                <!-- Button hover -->
                <button class="buy-btn">
                    Mua ngay
                </button>
            </div>
        </div>

        <div class="product-card fade-in">
            <div class="image-container">
                <img src="https://picsum.photos/300/200?2" alt="">
            </div>

            <div class="card-body">
                <h3>Keyboard</h3>
                <p>$89</p>

                <button class="buy-btn">
                    Mua ngay
                </button>
            </div>
        </div>

        <div class="product-card fade-in">
            <div class="image-container">
                <img src="https://picsum.photos/300/200?3" alt="">
            </div>

            <div class="card-body">
                <h3>Headphone</h3>
                <p>$120</p>

                <button class="buy-btn">
                    Mua ngay
                </button>
            </div>
        </div>

    </section>

</body>
</html>

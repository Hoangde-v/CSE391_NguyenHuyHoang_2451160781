<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Product Page</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="styles.scss">
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <nav class="navbar navbar-expand-md navbar-dark bg-dark px-3">
            <div class="container-fluid">

                <a class="navbar-brand fw-bold" href="#">
                    MyShop
                </a>

                <!-- Hamburger -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Menu -->
                <div class="collapse navbar-collapse" id="navbarMenu">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="#">Home</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">Products</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">Categories</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">Contact</a>
                        </li>
                    </ul>
                </div>

            </div>
        </nav>
    </header>

    <!-- MAIN -->
    <main class="main-layout">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <h4>Filters</h4>

            <select class="form-select mb-3">
                <option>All Categories</option>
                <option>Phone</option>
                <option>Laptop</option>
                <option>Accessories</option>
            </select>

            <button class="btn btn-dark w-100">
                Apply Filter
            </button>
        </aside>

        <!-- PRODUCT GRID -->
        <section class="products">

            <div class="product-grid">

                <!-- CARD 1 -->
                <div class="card product-card">
                    <img src="https://picsum.photos/300/200?1" class="card-img-top" alt="">
                    <div class="card-body">
                        <h5>Product 1</h5>
                        <p>$99</p>
                        <button class="btn btn-primary w-100">
                            Buy
                        </button>
                    </div>
                </div>

                <!-- CARD 2 -->
                <div class="card product-card">
                    <img src="https://picsum.photos/300/200?2" class="card-img-top" alt="">
                    <div class="card-body">
                        <h5>Product 2</h5>
                        <p>$120</p>
                        <button class="btn btn-primary w-100">
                            Buy
                        </button>
                    </div>
                </div>

                <!-- CARD 3 -->
                <div class="card product-card">
                    <img src="https://picsum.photos/300/200?3" class="card-img-top" alt="">
                    <div class="card-body">
                        <h5>Product 3</h5>
                        <p>$130</p>
                        <button class="btn btn-primary w-100">
                            Buy
                        </button>
                    </div>
                </div>

                <!-- CARD 4 -->
                <div class="card product-card">
                    <img src="https://picsum.photos/300/200?4" class="card-img-top" alt="">
                    <div class="card-body">
                        <h5>Product 4</h5>
                        <p>$150</p>
                        <button class="btn btn-primary w-100">
                            Buy
                        </button>
                    </div>
                </div>

                <!-- CARD 5 -->
                <div class="card product-card">
                    <img src="https://picsum.photos/300/200?5" class="card-img-top" alt="">
                    <div class="card-body">
                        <h5>Product 5</h5>
                        <p>$180</p>
                        <button class="btn btn-primary w-100">
                            Buy
                        </button>
                    </div>
                </div>

                <!-- CARD 6 -->
                <div class="card product-card">
                    <img src="https://picsum.photos/300/200?6" class="card-img-top" alt="">
                    <div class="card-body">
                        <h5>Product 6</h5>
                        <p>$210</p>
                        <button class="btn btn-primary w-100">
                            Buy
                        </button>
                    </div>
                </div>

                <!-- CARD 7 -->
                <div class="card product-card">
                    <img src="https://picsum.photos/300/200?7" class="card-img-top" alt="">
                    <div class="card-body">
                        <h5>Product 7</h5>
                        <p>$220</p>
                        <button class="btn btn-primary w-100">
                            Buy
                        </button>
                    </div>
                </div>

                <!-- CARD 8 -->
                <div class="card product-card">
                    <img src="https://picsum.photos/300/200?8" class="card-img-top" alt="">
                    <div class="card-body">
                        <h5>Product 8</h5>
                        <p>$250</p>
                        <button class="btn btn-primary w-100">
                            Buy
                        </button>
                    </div>
                </div>

            </div>
        </section>

        <!-- ADS BAR -->
        <aside class="ads-bar">
            <h4>Ads</h4>
            <p>Special Offers</p>
        </aside>

    </main>

    <!-- FOOTER -->
    <footer class="footer">
        © 2026 Responsive Product Page
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>

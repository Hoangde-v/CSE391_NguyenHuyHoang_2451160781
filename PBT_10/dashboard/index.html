<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi API Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Multi API Dashboard</h1> <button id="refreshBtn"> Refresh All </button>
        <p id="loadTime"></p> <!-- Loading tổng -->
        <div id="globalLoading"> Loading dashboard... </div>
        <div class="dashboard"> <!-- Widget User -->
            <div class="widget">
                <h2>Random User</h2>
                <div id="userWidget"> Loading... </div>
            </div> <!-- Widget Weather -->
            <div class="widget">
                <h2>Weather Hanoi</h2>
                <div id="weatherWidget"> Loading... </div>
            </div> <!-- Widget Dog -->
            <div class="widget">
                <h2>Random Dog</h2>
                <div id="dogWidget"> Loading... </div>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>

</html>

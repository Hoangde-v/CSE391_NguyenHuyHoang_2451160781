<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Weather App</h1>
        <div class="search-box"> <input type="text" id="cityInput" placeholder="Nhập tên thành phố..."> <button
                id="searchBtn"> Tìm </button> </div>
        <div id="historyContainer">
            <h3>Lịch sử tìm kiếm</h3>
            <ul id="historyList"></ul>
        </div> <!-- Loading -->
        <div id="loading" class="hidden">
            <div class="spinner"></div>
            <p>Đang tải...</p>
        </div> <!-- Error -->
        <div id="error" class="hidden"></div> <!-- Success -->
        <div id="weatherResult" class="hidden"> <img id="weatherIcon" src="" alt="weather icon">
            <h2 id="cityName"></h2>
            <p> Nhiệt độ: <span id="temperature"></span> °C </p>
            <p> Độ ẩm: <span id="humidity"></span> % </p>
            <p> Mô tả: <span id="description"></span> </p>
        </div>
    </div>
    <script src="main.js"></script>
</body>

</html>

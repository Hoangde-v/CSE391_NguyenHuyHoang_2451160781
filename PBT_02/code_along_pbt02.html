<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form đăng ký</title>
</head>
<body>
    <form action="#" method="POST">
        <fieldset>
            <legend>Thông tin cá nhân</legend>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="abc@gmail.com" required>

            <label for="password">Mật khẩu:</label>
            <input type="password" id="password" name="password" minlength="8" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" 
            title="Ít nhất 8 ký tự, gồm chữ hoa, chữ thường và số" required>

            <label for="phone">SĐT:</label>
            <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="0912345678">

            <label for="dob">Ngày sinh:</label>
            <input type="date" id="dob" name="dob" max="2010-01-01">
        </fieldset>

        <label>
            <input type="checkbox" name="agree" required>
            Tôi đồng ý điều khoản
        </label>

        <button type="submit">Đăng ký</button>
    </form>
</body>
</html>
